[package]
name = "barracuda-ip-intelligence"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Passive IP intelligence desktop application"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1.3"
dns-lookup = "4.0.2"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls", "query"] }
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "BarracudaIPIntelligence"
path = "src/main.rs"

[[bin]]
name = "ipintel"
path = "src/bin/ipintel.rs"

[profile.release]
strip = true
lto = "thin"
